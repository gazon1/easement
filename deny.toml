# cargo-deny policy: advisories, licences, sources. `cargo deny check`.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# serde-sarif generates its types from the SARIF schema at build time with
# schemafy, whose Inflector is BSD-2-Clause. It runs only in the build: nothing
# of it is in the binary.
exceptions = [{ allow = ["BSD-2-Clause"], crate = "Inflector" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
