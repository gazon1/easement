[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
# The fork publishes no Homebrew tap: the formula would point at the upstream tap.
installers = ["shell", "powershell"]
# The draft GitHub release is created by hand; dist uploads to it and undrafts it
create-release = false
# .deb and .rpm packages, built next to the archives and attached to the same release
local-artifacts-jobs = ["./build-linux-packages"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Build linux arm64 on a native runner; macOS arm64 on macos-15, since
# GitHub retires the macos-14 image dist defaults to on 2026-11-02
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-15"
